<script>
/* Hors de Claude : les fonctions Claude (Drive, Gmail, correction) ne sont pas disponibles */
if(!window.claude){ window.claude = { use: async function(){ return null; } }; }
function telechargerFichier(nom, blob){
  var url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = nom; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gris: #4F5358;
    --gris-fonce: #44484D;
    --jaune: #EBBD1F;
    --jaune-clair: #F3CF55;
    --texte: #F2F2F0;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--gris);
  }
  /* Le gris du logo est conservé dans les deux thèmes */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --gris: #4F5358; } }
  :root[data-theme="dark"] { --gris: #4F5358; }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; height: 100%;
    background: var(--gris);
    color: var(--texte);
    font-family: "Chakra Petch", "Segoe UI", Roboto, Arial, sans-serif;
  }
  .ecran { min-height: 100%; display: none; }
  .ecran.actif { display: flex; }

  /* Page d'accueil */
  #accueil {
    flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(2rem, 6vh, 4rem);
    padding: 2rem 1.25rem;
  }
  #accueil img {
    width: min(720px, 92vw); max-width: 100%; height: auto; display: block;
    animation: apparition 900ms cubic-bezier(.2,.7,.2,1) both;
  }
  .entrer {
    font: inherit; font-weight: 600; font-size: 1.125rem; letter-spacing: .04em;
    color: var(--gris); background: var(--jaune);
    border: 0; border-radius: 2px;
    padding: .9rem 2.5rem; cursor: pointer;
    animation: apparition 900ms 350ms cubic-bezier(.2,.7,.2,1) both;
    transition: background-color 150ms;
  }
  .boutons { display: flex; flex-direction: column; align-items: stretch; gap: 1rem; }
  .entrer:hover { background: var(--jaune-clair); }
  .entrer:focus-visible, .retour:focus-visible { outline: 3px solid var(--texte); outline-offset: 4px; }

  /* Page suivante (à définir) */
  #suite { flex-direction: column; }
  .barre {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: .75rem 1.25rem; background: var(--gris-fonce);
    border-bottom: 2px solid var(--jaune);
  }
  .barre img { height: 44px; width: auto; display: block; }
  .retour {
    font: inherit; font-size: .95rem; color: var(--jaune); background: none;
    border: 1px solid var(--jaune); border-radius: 2px; padding: .4rem 1rem; cursor: pointer;
  }
  .contenu {
    flex: 1; display: grid; place-items: center; text-align: center; padding: 2rem 1.25rem;
  }
  .contenu p { max-width: 40ch; font-size: 1.125rem; line-height: 1.5; margin: 0; opacity: .85; }

  /* Signature en bas à droite de l'accueil */
  #accueil { position: relative; padding-bottom: 4.5rem; }
  .signature {
    position: absolute; right: 16px; bottom: 16px;
    display: inline-flex; align-items: center; gap: .4rem;
    font-family: "Comic Sans MS", "Comic Neue", "Chalkboard SE", cursive, sans-serif;
    font-size: .95rem; line-height: 1; color: var(--texte);
    background: rgba(0,0,0,.18); border: 1px solid rgba(235,189,31,.55);
    padding: .45rem .8rem; border-radius: 999px;
    pointer-events: none; user-select: none;
    animation: apparition 900ms 700ms cubic-bezier(.2,.7,.2,1) both;
  }
  .signature b { color: var(--jaune); font-weight: 700; letter-spacing: .02em; }
  @keyframes apparition { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { #accueil img, .entrer, .signature { animation: none; } }

  /* ===== Horaires clients 1.2 (intégré) ===== */
#clients{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#4F5358;--card:#fff;--tx:#1b1f24;--mu:#667085;--ac:#1f6feb;--bd:#e3e6ea;--chip:#eaf1fe}
@media(prefers-color-scheme:dark){
#clients:not([data-theme="light"]){--bg:#4F5358;--card:#1b2027;--tx:#e8ebef;--mu:#98a2b3;--ac:#5b9bff;--bd:#2b323b;--chip:#1e2a3d}}
#clients[data-theme="dark"]{--bg:#4F5358;--card:#1b2027;--tx:#e8ebef;--mu:#98a2b3;--ac:#5b9bff;--bd:#2b323b;--chip:#1e2a3d}
#clients{scroll-padding-top:env(safe-area-inset-top,0px)}
#clients *{box-sizing:border-box}
#clients{margin:0;background:var(--bg);color:var(--tx);font-family:"Comic Sans MS","Comic Neue","Chalkboard SE","Comic Sans",cursive,sans-serif}
#clients input,#clients button,#clients select,#clients textarea{font-family:inherit}
#clients header h1,#clients header button,#clients .home .hd h1,#clients .home .hd button,#clients .dtitle #c-detailName{color:#fff}
#clients #c-n{color:#d5d9de}
#clients header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 14px 8px;z-index:2;border-bottom:1px solid var(--bd)}
#clients h1{font-size:18px;margin:0 0 8px}
#clients input{width:100%;padding:11px 12px;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
#clients .f{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
#clients .f button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 10px;border-radius:99px;font-size:13px;cursor:pointer}
#clients .f button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#clients #c-n{font-size:12px;color:var(--mu);margin-top:6px}
#clients main{max-width:720px;margin:0 auto;padding:10px 14px 30px;display:grid;gap:8px}
#clients .c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 13px}
#clients .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
#clients .t b{font-size:15px}
#clients .t span{color:var(--mu);font-size:13px}
#clients .h{margin-top:4px;font-size:14px;color:var(--ac);font-weight:600}
#clients .b{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap}
#clients .b i{font-style:normal;font-size:12px;background:var(--chip);color:var(--ac);padding:2px 8px;border-radius:99px}
#clients .p{margin-top:6px;font-size:13px;color:var(--mu)}
#clients .hd{display:flex;justify-content:space-between;align-items:center}
#clients .hd h1{margin:0 0 8px}
#clients .home{max-width:480px;margin:0 auto;padding:24px 16px}
#clients .home .hd{margin-bottom:8px}
#clients .home h1{font-size:20px;margin:0}
#clients .home-gap{height:54px}
#clients .home input{width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);margin-bottom:16px}
#clients .nav-tile{display:flex;align-items:center;gap:12px;width:100%;padding:18px;border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);font-size:17px;cursor:pointer;text-align:start}
#clients .nav-tile+.nav-tile{margin-top:12px}
#clients .vide{text-align:center;color:var(--mu);padding:30px 10px}
#clients .nav-tile span{flex:1}
#clients .nav-tile small{display:block;font-weight:400;color:var(--mu);font-size:12px;margin-top:3px}
#clients #c-gear{background:none;border:0;font-size:22px;cursor:pointer;padding:4px 6px;margin-bottom:8px}
#clients .mb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:5;align-items:center;justify-content:center;padding:16px}
#clients .mb.open{display:flex}
#clients .md{background:var(--card);color:var(--tx);border-radius:14px;padding:16px;width:100%;max-width:420px;max-height:90%;overflow:auto}
#clients .md h2{margin:0 0 12px;font-size:18px}
#clients .md label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
#clients .md .r{display:flex;gap:10px}
#clients .md .r>div{flex:1}
#clients .md .sv{width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:16px;cursor:pointer}
#clients .mi{display:block;width:100%;margin-top:10px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:16px;text-align:start;cursor:pointer}
#clients .md select{width:100%;padding:11px 12px;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
#clients .md input[type=color]{width:100%;height:40px;padding:2px}
#clients .md label.ck{display:flex;align-items:center;gap:8px;color:var(--tx);font-size:15px;margin-top:14px}
#clients .md label.ck input{width:auto}
#clients .hb{font-size:14px;line-height:1.5;max-height:60vh;overflow-y:auto}
#clients .hb p{margin:0 0 10px}
#clients .cr{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 13px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
#clients .cr b{flex:1;font-weight:400}
#clients .cr span{color:var(--mu);font-size:13px}
#clients #c-detailBody{padding:0}
#clients .gps-btn{display:block;margin-top:16px!important;width:50%;min-width:200px;margin-left:auto!important;margin-right:auto!important;background:#EBBD1F;color:#1b1f24;text-decoration:none;border-radius:26px;padding:14px 18px;margin:0 0 16px;text-align:center;font-weight:600;line-height:1.5}
#clients .section-title{font-weight:700;font-size:15px;margin:16px 0 20px;padding-inline-start:16px}
#clients .tag-clients{color:#e5484d;font-weight:700;font-size:14px;letter-spacing:.03em}
#clients .info-box{background:#f0f1f3;border-radius:14px;padding:16px;margin:12px 0 16px}
#clients .info-box .ib-label{font-weight:700;font-size:13px;color:var(--mu)}
#clients .info-box .ib-val{font-size:17px;margin:2px 0 14px}
#clients .info-box .ib-val:last-child{margin-bottom:0}
@media (prefers-color-scheme: dark){
#clients:not([data-theme="light"]) .info-box{background:#20242b}}
#clients[data-theme="dark"] .info-box{background:#20242b}
#clients .dtitle{margin:6px 0 0;font-size:19px;font-weight:600}
#clients #c-detailName{display:block;margin-top:4px;font-weight:400}
#clients .dot{display:inline-block;vertical-align:middle;margin:0 8px;font-size:1.4em;font-weight:700}
#clients .eqrow{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
#clients .eqp{flex:1;min-width:80px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 6px;border-radius:10px;font-size:15px;font-weight:700;border:1px solid var(--bd)}
#clients .eqp .dot{width:22px;height:22px;border-radius:50%;display:block}
#clients .eqp.yes .dot{background:#22b14c;box-shadow:0 0 0 3px rgba(34,177,76,.25)}
#clients .eqp.no .dot{background:#e53935;box-shadow:0 0 0 3px rgba(229,57,53,.25)}
#clients .gps-link{color:var(--ac);font-weight:700;text-decoration:underline;word-break:break-word}
#clients .alert-box{display:flex;gap:8px;align-items:flex-start;margin-top:4px;padding:12px 14px;border-radius:10px;background:#fff4d6;color:#7a4d00;border:1px solid #EBBD1F;font-size:16px;font-weight:700;line-height:1.35}
@media (prefers-color-scheme: dark){#clients:not([data-theme="light"]) .alert-box{background:#3a2e0b;color:#ffd77a}}
#clients[data-theme="dark"] .alert-box{background:#3a2e0b;color:#ffd77a}
#clients .hg{display:grid;grid-template-columns:auto 1fr;column-gap:14px;row-gap:2px}
#clients .nf{max-width:480px;margin:0 auto;padding:24px 16px 40px}
#clients .nf .hd h1{font-size:20px;margin:0;color:#fff}
#clients .nf .bk{background:none;border:0;font-size:22px;cursor:pointer;padding:4px 6px;color:#fff}
#clients .nf .lbl{display:block;margin:20px 0 8px;font-weight:700;font-size:15px;color:#EBBD1F}
#clients .nf input[type=text],#clients .nf textarea{display:block;width:100%;padding:12px 14px;font-size:16px;line-height:1.4;border:1px solid #d0d4d9;border-radius:10px;background:#fff;color:#1b1f24;margin:0}
#clients .nf textarea{min-height:90px;resize:vertical}
#clients .nf input::placeholder,#clients .nf textarea::placeholder{color:#8a919b}
#clients .nf .eq{display:flex;gap:10px;flex-wrap:wrap}
#clients .nf .eq label{flex:1;min-width:90px;display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;color:#1b1f24;border:1px solid #d0d4d9;border-radius:10px;padding:12px 8px;font-size:16px;cursor:pointer;user-select:none}
#clients .nf .eq input{width:20px;height:20px;margin:0;accent-color:#EBBD1F;cursor:pointer}
#clients .nf .eq label:has(input:checked){border-color:#EBBD1F;box-shadow:0 0 0 2px #EBBD1F inset;font-weight:700}
#clients .nf .gm-btn{display:block;width:50%;min-width:200px;margin:28px auto 0;background:#EBBD1F;color:#1b1f24;border:0;border-radius:26px;padding:14px 18px;font-size:16px;font-weight:700;cursor:pointer}
#clients .nf .gm-btn:disabled{opacity:.6;cursor:default}
#clients .nf #c-nfMsg{text-align:center;margin-top:12px;font-size:14px;color:#fff;min-height:1.2em}
#clients .nf input:focus-visible,#clients .nf textarea:focus-visible,#clients .nf .gm-btn:focus-visible{outline:3px solid #EBBD1F;outline-offset:2px}
#clients.ecran.actif{display:block;}
#clients{min-height:100%;}

  /* ===== Garage 1.2 (intégré) ===== */
#garage{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#4F5358;--card:#fff;--tx:#1b1f24;--mu:#667085;--ac:#1f6feb;--bd:#e3e6ea}
@media(prefers-color-scheme:dark){
#garage:not([data-theme="light"]){--bg:#4F5358;--card:#1b2027;--tx:#e8ebef;--mu:#98a2b3;--ac:#5b9bff;--bd:#2b323b}}

      var code = String(langues[i] || "").slice(0, 2).toLowerCase();
      if (TXT[code]) { lg = code; break; }
    }
    var boutons = document.querySelectorAll("#accueil [data-accueil]");

    }
  })();
